<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" fill="none">
  <defs>
    <!-- ផ្កាកុលាប / stylised rose -->
    <g id="rz">
      <circle r="22" fill="#F5C2CA"/>
      <path d="M-22 -3A22 22 0 0 1 -5 -21" stroke="#E79CAA" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M22 4A22 22 0 0 1 4 21" stroke="#E79CAA" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle r="15" fill="#F9D3D9"/>
      <path d="M-15 5A15 15 0 1 1 9 12" stroke="#E894A4" stroke-width="2.1" fill="none" stroke-linecap="round"/>
      <circle r="8.5" fill="#F2B3BE"/>
      <path d="M-8 3A8 8 0 1 1 5 7" stroke="#DE8294" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <circle r="3.4" fill="#FBE2E6"/>
    </g>
    <!-- ក្រពុំ / bud -->
    <g id="bd">
      <path d="M0 -13C7 -8 9 0 0 13C-9 0 -7 -8 0 -13Z" fill="#F3BAC4"/>
      <path d="M0 -10C4 -5 5 1 0 9" stroke="#E08EA0" stroke-width="1.4" fill="none"/>
    </g>
    <!-- ស្លឹក / leaf -->
    <g id="lf">
      <path d="M0 0C7 -11 21 -13 31 -5C21 5 7 9 0 0Z" fill="#C3D0B3"/>
      <path d="M1 0C10 -3 20 -5 30 -5" stroke="#A8B998" stroke-width="1.2" fill="none"/>
    </g>
  </defs>

  <!-- មែក / vines -->
  <g stroke="#B6A38C" stroke-width="2" fill="none" stroke-linecap="round" opacity=".55">
    <path d="M-10 120C120 60 260 66 380 120"/>
    <path d="M820 120C940 66 1080 60 1210 120"/>
    <path d="M380 128C520 100 680 100 820 128"/>
  </g>

  <!-- ស្លឹក / leaves -->
  <g opacity=".85">
    <use href="#lf" transform="translate(70 118) rotate(-24) scale(1.3)"/>
    <use href="#lf" transform="translate(196 92) rotate(-8) scale(1.15)"/>
    <use href="#lf" transform="translate(300 96) rotate(16) scale(1.25)"/>
    <use href="#lf" transform="translate(150 132) rotate(168) scale(1.1)"/>
    <use href="#lf" transform="translate(468 116) rotate(-14) scale(1)"/>
    <use href="#lf" transform="translate(700 112) rotate(190) scale(1)"/>
    <use href="#lf" transform="translate(884 96) rotate(-18) scale(1.2)"/>
    <use href="#lf" transform="translate(1010 88) rotate(8) scale(1.15)"/>
    <use href="#lf" transform="translate(1120 116) rotate(200) scale(1.3)"/>
    <use href="#lf" transform="translate(960 134) rotate(172) scale(1.1)"/>
  </g>

  <!-- ក្រពុំ / buds -->
  <g opacity=".95">
    <use href="#bd" transform="translate(246 74) rotate(-18) scale(1.1)"/>
    <use href="#bd" transform="translate(556 104) rotate(10) scale(.9)"/>
    <use href="#bd" transform="translate(648 100) rotate(-12) scale(.9)"/>
    <use href="#bd" transform="translate(962 70) rotate(14) scale(1.1)"/>
  </g>

  <!-- ផ្កាកុលាប / roses -->
  <g>
    <use href="#rz" transform="translate(48 132) scale(1.35)"/>
    <use href="#rz" transform="translate(126 104) scale(1)"/>
    <use href="#rz" transform="translate(196 130) scale(1.2)"/>
    <use href="#rz" transform="translate(292 128) scale(.85)"/>
    <use href="#rz" transform="translate(372 136) scale(.7)"/>
    <use href="#rz" transform="translate(600 130) scale(.6)"/>
    <use href="#rz" transform="translate(828 136) scale(.7)"/>
    <use href="#rz" transform="translate(908 128) scale(.85)"/>
    <use href="#rz" transform="translate(1004 130) scale(1.2)"/>
    <use href="#rz" transform="translate(1074 104) scale(1)"/>
    <use href="#rz" transform="translate(1152 132) scale(1.35)"/>
  </g>
</svg>
